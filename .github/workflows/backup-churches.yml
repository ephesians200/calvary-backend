name: 3. Back up all churches
# Every night (02:30 UTC) and on demand: copies each church's database into the private R2 bucket "churchdome-backups".
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency: churchdome-ops
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Back up
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-churches.mjs

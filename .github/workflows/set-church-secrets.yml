name: 4. Set a church's secrets
# For secrets that arrive later (the church's Firebase key, its Paystack key).
# First add GitHub secrets named FCM_<id> and/or PAYSTACK_<id> (for example FCM_JIREH), then run this with the id.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Church id, e.g. jireh'
        required: true
      sign_everyone_out:
        description: 'Also replace the login-signing secret (signs every leader and member out)'
        type: boolean
        default: false

concurrency: churchdome-ops
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets[format('FCM_{0}', inputs.slug)] }}
          PAYSTACK_SECRET_KEY: ${{ secrets[format('PAYSTACK_{0}', inputs.slug)] }}
          IN_SLUG: ${{ inputs.slug }}
          ROTATE: ${{ inputs.sign_everyone_out }}
        run: node scripts/set-secrets.mjs "$IN_SLUG" $([ "$ROTATE" = "true" ] && echo --rotate-jwt)

name: 5. Reset a pastor's password
# Gives a church leader a new temporary password. It appears once, in the run's Summary.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Church id, e.g. jireh'
        required: true
      username:
        description: 'Leader username'
        required: true
        default: 'pastor'

concurrency: churchdome-ops
permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IN_SLUG: ${{ inputs.slug }}
          IN_USER: ${{ inputs.username }}
        run: node scripts/reset-pastor.mjs "$IN_SLUG" "$IN_USER"
